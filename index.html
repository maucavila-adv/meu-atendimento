<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escritório Ávila - Proteção Financeira do Consumidor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            padding: 30px;
            border-top: 5px solid #1e3a8a;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 22px;
            color: #1e3a8a;
            margin-bottom: 6px;
            font-weight: 700;
        }

        .header h2 {
            font-size: 14px;
            color: #555;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .header p {
            font-size: 13px;
            color: #666;
            background: #edf2f7;
            padding: 10px;
            border-radius: 6px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #444;
            margin-bottom: 6px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #1e3a8a;
        }

        button {
            width: 100%;
            background-color: #25d366;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #1ebc57;
        }

        .footer-note {
            text-align: center;
            font-size: 11px;
            color: #888;
            margin-top: 15px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>ESCRITÓRIO ÁVILA</h1>
        <h2>Proteção Financeira do Consumidor</h2>
        <p>Análise de prejuízos com Bancos, Financeiras e Planos de Saúde. Preencha abaixo para iniciar no WhatsApp.</p>
    </div>

    <form id="leadForm">
        <div class="form-group">
            <label for="nome">Seu Nome Completo:</label>
            <input type="text" id="nome" placeholder="Ex.: Maria Silva" required>
        </div>

        <div class="form-group">
            <label for="telefoneCliente">Seu Telefone / WhatsApp com DDD:</label>
            <input type="tel" id="telefoneCliente" placeholder="Ex.: (11) 99999-9999" required>
        </div>

        <div class="form-group">
            <label for="problema">Qual o seu problema principal?</label>
            <select id="problema" required>
                <option value="">Selecione uma opção...</option>
                <option value="Fraudes Bancarias / Golpe do PIX">Fraudes Bancárias / Golpe do PIX / Falsa Central</option>
                <option value="Credito Consignado / RMC">Empréstimo Consignado Não Solicitado / RMC</option>
                <option value="Plano de Saude / Negativa">Negativa do Plano de Saúde (Exame/Cirurgia/Remédio)</option>
                <option value="Cobranca Indevida / Banco">Cobrança Indevida ou Conta Invasão</option>
                <option value="Outro Assunto">Outro problema com banco ou saúde</option>
            </select>
        </div>

        <div class="form-group">
            <label for="documentos">Possui comprovantes/documentos?</label>
            <select id="documentos" required>
                <option value="Sim">Sim, tenho contratos/extratos/boletim</option>
                <option value="Alguns">Tenho apenas alguns prints/comprovantes</option>
                <option value="Nao">Não tenho no momento</option>
            </select>
        </div>

        <div class="form-group">
            <label for="detalhes">Resumo rápido do seu caso:</label>
            <textarea id="detalhes" rows="3" placeholder="Descreva brevemente o que aconteceu com o banco ou plano de saúde..." required></textarea>
        </div>

        <button type="button" onclick="enviarWhatsApp()">
            ANALISAR MEU CASO PELO WHATSAPP
        </button>
    </form>

    <div class="footer-note">
        🔒 Seus dados estão protegidos de acordo com a LGPD.<br>
        Atendimento informativo referente ao Provimento 205/2021 da OAB.
    </div>
</div>

<script>
    function enviarWhatsApp() {
        // ATENÇÃO: Altere o número abaixo pelo SEU número real com DDD (Exemplo: 55 + DDD + Número)
        const numeroSeuWhatsapp = "5513991749820";

        const nome = document.getElementById('nome').value;
        const telefoneCliente = document.getElementById('telefoneCliente').value;
        const problema = document.getElementById('problema').value;
        const documentos = document.getElementById('documentos').value;
        const detalhes = document.getElementById('detalhes').value;

        if (!nome || !telefoneCliente || !problema || !detalhes) {
            alert("Por favor, preencha todos os campos do formulário antes de continuar.");
            return;
        }

        // Formatação da mensagem enviada com o telefone do cliente gravado no texto
        const mensagem = `*Solicitação de Análise - Escritório Ávila*%0A%0A` +
            `*Nome:* ${encodeURIComponent(nome)}%0A` +
            `*Telefone/WhatsApp:* ${encodeURIComponent(telefoneCliente)}%0A` +
            `*Problema:* ${encodeURIComponent(problema)}%0A` +
            `*Possui Documentos:* ${encodeURIComponent(documentos)}%0A` +
            `*Resumo do Caso:* ${encodeURIComponent(detalhes)}`;

        // Abre a conversa diretamente no seu WhatsApp
        window.open(`https://wa.me/${numeroSeuWhatsapp}?text=${mensagem}`, '_blank');
    }
</script>

</body>
</html>
